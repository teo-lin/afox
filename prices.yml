# USD per 1,000,000 tokens, keyed by the `provider.model` that roles.yml selects.
# cost.mjs reads this; a model with no entry reports tokens and "price unset"
# rather than a guessed number.
#
# claude rates are Anthropic list prices (2026-06). cache_write is 1.25x input and
# cache_read 0.1x input — the standard multipliers, not separately published per model.
# Every other provider is left unpriced on purpose: fill in the rate your account
# actually pays before trusting a spend figure.

claude.opus:
  input: 5.00
  cache_write: 6.25
  cache_read: 0.50
  output: 25.00

claude.sonnet:
  input: 2.00
  cache_write: 2.50
  cache_read: 0.20
  output: 10.00

claude.fable:
  input: 10.00
  cache_write: 12.50
  cache_read: 1.00
  output: 50.00

claude.haiku:
  input: 1.00
  cache_write: 1.25
  cache_read: 0.10
  output: 5.00
